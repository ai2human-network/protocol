name: Protocol change proposal
description: Discuss a protocol change before submitting an AIP.
title: "[Protocol]: "
labels: ["protocol", "needs-aip"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What interoperability or safety problem requires a protocol change?
    validations: { required: true }
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
    validations: { required: true }
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, funding, and settlement impact
    validations: { required: true }

